<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><title>UML Producto</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker></defs><rect x="0" y="0" width="800" height="430" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="400" y="22" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">Diagrama de clases UML: la clase Producto y un objeto de esa clase</text>
<rect x="60" y="50" width="300" height="212" rx="0" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<rect x="60" y="50" width="300" height="40" rx="0" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="210.0" y="70.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">Producto</text>
<line x1="60" y1="200" x2="360" y2="200" stroke="#1565C0" stroke-width="2"/>
<text x="74" y="109" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">- codigo : string</text>
<text x="74" y="133" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">- nombre : string</text>
<text x="74" y="157" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">- precio : double</text>
<text x="74" y="181" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">- stock : int</text>
<text x="74" y="219" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">+ mostrarDatos() : void</text>
<text x="74" y="243" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">+ calcularValorStock() : double</text>
<line x1="392" y1="70.0" x2="368" y2="70.0" stroke="#607D8B" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="400" y="70.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">① Nombre de la clase (el «molde»)</text>
<line x1="392" y1="145.0" x2="368" y2="145.0" stroke="#607D8B" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="400" y="145.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">② Atributos: los DATOS  →  nombre : tipo</text>
<line x1="392" y1="231.0" x2="368" y2="231.0" stroke="#607D8B" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="400" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">③ Operaciones: lo que SABE HACER</text>
<text x="400" y="167.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">«-» = privado (solo la clase lo usa)</text>
<text x="400" y="253.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">nombre() : tipo de retorno  ·  «+» = público</text>
<rect x="470" y="268" width="290" height="36" rx="0" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="615.0" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">p1 : Producto</text>
<line x1="563.0" y1="296" x2="667.0" y2="296" stroke="#263238" stroke-width="1.2"/>
<rect x="470" y="304" width="290" height="100" rx="0" fill="#FFFFFF" stroke="#F9A825" stroke-width="2"/>
<text x="482" y="322" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">codigo = "PRD-0012"</text>
<text x="482" y="344" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">nombre = "Mouse inalambrico"</text>
<text x="482" y="366" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">precio = 45.90</text>
<text x="482" y="388" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">stock = 30</text>
<path d="M470,338 C400,338 250.0,308 210.0,266" stroke="#F9A825" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<text x="300" y="360" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#F9A825" text-anchor="middle" dominant-baseline="central" font-style="italic">«instancia de»</text>
<text x="300" y="380" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">(un OBJETO concreto,</text>
<text x="300" y="396" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">con valores reales)</text></svg>
