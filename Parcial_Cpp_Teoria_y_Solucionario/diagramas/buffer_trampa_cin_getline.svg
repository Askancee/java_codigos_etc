<text x="390" y="346" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#263238" text-anchor="middle" dominant-baseline="central">ws («white space») descarta los espacios y Enters pendientes antes de leer la línea.</text>
<text x="390" y="366" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">Otra opción: escribir  cin.ignore();  justo antes del getline.</text></svg>
