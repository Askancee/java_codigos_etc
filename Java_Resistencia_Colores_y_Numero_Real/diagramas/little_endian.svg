<text x="380" y="300" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#263238" text-anchor="middle" dominant-baseline="central">Little-endian = «el byte menos significativo primero». El programa de la Parte 1 muestra este orden.</text></svg>
