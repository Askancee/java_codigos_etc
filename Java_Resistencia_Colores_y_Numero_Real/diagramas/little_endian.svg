<text x="380" y="22" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">¿En qué orden se guardan los 4 bytes de −6.75f = C0 D8 00 00 ?</text>
