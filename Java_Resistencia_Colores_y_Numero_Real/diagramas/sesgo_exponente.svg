<text x="250" y="238" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" fill="#263238" text-anchor="middle" dominant-baseline="central"><tspan font-weight="bold">Guardar: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace">campo = exponente real + 127</tspan></text>
<text x="650" y="238" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" fill="#263238" text-anchor="middle" dominant-baseline="central"><tspan font-weight="bold">Leer: </tspan><tspan font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace">exponente real = campo − 127</tspan></text>
<text x="250" y="266" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" fill="#263238" text-anchor="middle" dominant-baseline="central"><tspan>6.75 = 1.1011 × 2</tspan><tspan font-size="9" dy="-5">2</tspan><tspan dy="5"> → 2 + 127 = 129 = 10000001</tspan></text>
<text x="650" y="266" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" fill="#263238" text-anchor="middle" dominant-baseline="central"><tspan>0.1 ≈ 1.6 × 2</tspan><tspan font-size="9" dy="-5">−4</tspan><tspan dy="5"> → −4 + 127 = 123 = 01111011</tspan></text>
<text x="450" y="292" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">Los campos 0 y 255 están reservados: los exponentes reales de un número normal van de −126 a +127.</text>
<text x="450" y="314" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">En double el campo tiene 11 bits y el sesgo es 1023 (exponentes reales de −1022 a +1023).</text></svg>
