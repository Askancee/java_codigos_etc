<text x="410" y="252" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">Con amarillo, violeta, rojo muestra:  4 - 7 - 2</text>
<text x="410" y="276" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">La ampliación (Valor_Resistencia_segun_Colores_Bandas) además calcula el valor:  47 × 10² = 4700 Ohm</text></svg>
