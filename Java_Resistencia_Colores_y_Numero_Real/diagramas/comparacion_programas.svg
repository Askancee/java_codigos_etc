<line x1="214" y1="90" x2="296" y2="90" stroke="#455A64" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300" y="68" width="220" height="44" rx="0" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.8"/>
<text x="410" y="90" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">switch(ncb1)</text>
<line x1="524" y1="90" x2="606" y2="90" stroke="#455A64" stroke-width="2" marker-end="url(#arr)"/>
<rect x="610" y="68" width="170" height="44" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.8"/>
<text x="695" y="90" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">"Amarillo"</text>
<text x="40" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="start" dominant-baseline="central">Nuestro programa (Numeros_bandas_segun_Colores_Resistencia)</text>
<rect x="40" y="178" width="170" height="44" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.8"/>
<text x="125" y="200" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">"amarillo"</text>
<line x1="214" y1="200" x2="296" y2="200" stroke="#455A64" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300" y="178" width="220" height="44" rx="0" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.8"/>
<text x="410" y="200" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">switch(colorb1)</text>
