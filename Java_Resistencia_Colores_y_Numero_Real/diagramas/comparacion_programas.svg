<svg xmlns="http://www.w3.org/2000/svg" width="820" height="292" viewBox="0 0 820 292"><title>Comparación de programas</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker></defs><rect x="0" y="0" width="820" height="292" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="410" y="22" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">El programa de clase y el nuestro hacen el camino INVERSO</text>
<text x="40" y="56" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="start" dominant-baseline="central">Programa de clase (Colores_bandas_segun_valor_Resistencia_Varios2)</text>
