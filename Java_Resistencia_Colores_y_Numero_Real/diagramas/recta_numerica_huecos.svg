<text x="410" y="268" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">Formato «de juguete» con solo 2 bits de mantisa. El float usa 23 y el double 52 (puntos mucho más juntos),</text>
<text x="410" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">pero el patrón es el mismo: cada vez que el número se duplica, el hueco entre valores posibles también se duplica.</text></svg>
