<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380"><title>Resistencia de 4 bandas</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker></defs><rect x="0" y="0" width="820" height="380" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="410" y="22" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">Leer una resistencia de 4 bandas</text>
<line x1="30" y1="190" x2="790" y2="190" stroke="#9E9E9E" stroke-width="7"/>
<path d="M210,150 Q210,135 240,135 L300,135 Q320,144 340,144 L480,144 Q500,144 520,135 L580,135 Q610,135 610,150 L610,230 Q610,245 580,245 L520,245 Q500,236 480,236 L340,236 Q320,236 300,245 L240,245 Q210,245 210,230 Z" stroke="#A1887F" stroke-width="2" fill="#E8D5A9"/>
