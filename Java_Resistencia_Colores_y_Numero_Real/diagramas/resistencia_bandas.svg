<rect x="339" y="144" width="22" height="92" rx="0" fill="#D32F2F" stroke="#5D4037" stroke-width="0.8"/>
<rect x="529" y="135" width="22" height="110" rx="0" fill="#C9A227" stroke="#5D4037" stroke-width="0.8"/>
<line x1="250" y1="82" x2="250" y2="132" stroke="#607D8B" stroke-width="1.2"/>
<text x="244" y="52" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#263238" text-anchor="end" dominant-baseline="central">1ª banda: AMARILLO</text>
<text x="244" y="70" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="end" dominant-baseline="central">1ª cifra = 4</text>
<line x1="300" y1="122" x2="300" y2="132" stroke="#607D8B" stroke-width="1.2"/>
<text x="306" y="92" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#263238" text-anchor="start" dominant-baseline="central">2ª banda: VIOLETA</text>
<text x="306" y="110" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">2ª cifra = 7</text>
<line x1="350" y1="248" x2="350" y2="278" stroke="#607D8B" stroke-width="1.2"/>
<text x="350" y="294" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">3ª banda: ROJO</text>
<text x="350" y="312" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">multiplicador × 10² = × 100</text>
<line x1="540" y1="248" x2="540" y2="278" stroke="#607D8B" stroke-width="1.2"/>
<text x="540" y="294" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">4ª banda: DORADO</text>
<text x="540" y="312" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">tolerancia ± 5 %</text>
<text x="470" y="80" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central" font-style="italic">← se empieza a leer por el lado</text>
<text x="470" y="96" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central" font-style="italic">   más alejado de la banda dorada</text>
<rect x="40" y="330" width="740" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="410" y="350" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">R = 47 × 100 = 4 700 Ω = 4.7 kΩ  (± 5 %: entre 4 465 Ω y 4 935 Ω)</text></svg>
