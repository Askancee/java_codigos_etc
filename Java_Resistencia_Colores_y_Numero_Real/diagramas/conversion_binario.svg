<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360"><title>Conversión a binario</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker></defs><rect x="0" y="0" width="820" height="360" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="410" y="22" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">Convertir 6.75 a binario (a mano)</text>
<rect x="30" y="46" width="360" height="230" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
<text x="210" y="68" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle" dominant-baseline="central">Parte entera: 6  →  dividir entre 2</text>
<text x="70" y="108" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">6 ÷ 2 = 3</text>
<text x="210" y="108" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">resto</text>
<rect x="262" y="93" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/>
<text x="277" y="109" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#1565C0" text-anchor="middle" dominant-baseline="central">0</text>
<text x="70" y="148" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">3 ÷ 2 = 1</text>
<text x="210" y="148" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">resto</text>
<rect x="262" y="133" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/>
<text x="277" y="149" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#1565C0" text-anchor="middle" dominant-baseline="central">1</text>
<text x="70" y="188" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">1 ÷ 2 = 0</text>
<text x="210" y="188" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">resto</text>
<rect x="262" y="173" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/>
<text x="277" y="189" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#1565C0" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="318" y1="188" x2="318" y2="92" stroke="#1565C0" stroke-width="2" marker-end="url(#arr)"/>
<text x="328" y="116" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1565C0" text-anchor="start" dominant-baseline="central">leer</text>
<text x="328" y="132" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1565C0" text-anchor="start" dominant-baseline="central">de abajo</text>
<text x="328" y="148" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1565C0" text-anchor="start" dominant-baseline="central">hacia</text>
<text x="328" y="164" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1565C0" text-anchor="start" dominant-baseline="central">arriba</text>
<text x="210" y="250" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="20" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">6  =  110₂</text>
<rect x="430" y="46" width="360" height="230" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="610" y="68" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">Parte fraccionaria: 0.75  →  multiplicar por 2</text>
<text x="460" y="108" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">0.75 × 2 = 1.5</text>
<text x="630" y="108" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">→</text>
<rect x="652" y="93" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="667" y="109" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">1</text>
<text x="460" y="148" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16" font-weight="normal" fill="#263238" text-anchor="start" dominant-baseline="central">0.5  × 2 = 1.0</text>
<text x="630" y="148" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central">→</text>
<rect x="652" y="133" width="30" height="30" rx="4" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="667" y="149" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#2E7D32" text-anchor="middle" dominant-baseline="central">1</text>
<text x="460" y="188" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#607D8B" text-anchor="start" dominant-baseline="central" font-style="italic">quedó 0.0 → se terminó</text>
<line x1="708" y1="92" x2="708" y2="150" stroke="#2E7D32" stroke-width="2" marker-end="url(#arr)"/>
<text x="718" y="98" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" dominant-baseline="central">leer</text>
<text x="718" y="114" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" dominant-baseline="central">de arriba</text>
<text x="718" y="130" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" dominant-baseline="central">hacia</text>
<text x="718" y="146" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" dominant-baseline="central">abajo</text>
<text x="610" y="250" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="20" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">0.75  =  0.11₂</text>
<text x="410" y="306" font-family="'DejaVu Sans Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="22" font-weight="bold" fill="#263238" text-anchor="middle" dominant-baseline="central">6.75  =  110.11₂</text>
<text x="410" y="338" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#607D8B" text-anchor="middle" dominant-baseline="central">Comprobación: 1×4 + 1×2 + 0×1 + 1×0.5 + 1×0.25 = 6.75 ✓</text></svg>
